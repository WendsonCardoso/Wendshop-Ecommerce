<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho | WendShop</title>

<link rel="stylesheet" href="css/carrinho.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="top">
  <div class="logo">
    <h2>WendShop</h2>
  </div>

  <a href="index.html">← Continuar comprando</a>
</header>

<main class="container">

  <section id="cartItems"></section>

  <div id="emptyCart" class="empty hidden">
    <i class="fas fa-shopping-bag"></i>
    <h2>Seu carrinho está vazio</h2>
    <p>Explore nossos produtos e encontre algo incrível</p>
    <a href="index.html" class="btn">Explorar produtos</a>
  </div>

  <aside class="summary">

    <h3>Resumo</h3>

    <div class="row">
      <span>Subtotal</span>
      <span id="subtotal">R$ 0,00</span>
    </div>

    <div class="row">
      <span>Frete</span>
      <span id="frete">R$ 0,00</span>
    </div>

    <div class="row total">
      <span>Total</span>
      <span id="total">R$ 0,00</span>
    </div>

    <button class="checkout">
      Finalizar Pedido
    </button>

  </aside>

</main>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <i class="fas fa-check-circle"></i>
    <h2>Pedido confirmado com sucesso!</h2>
    <p>
      Obrigado por comprar na WendShop.<br>
      Seu pedido foi recebido e já está sendo preparado.
    </p>
    <button onclick="closeModal()">Continuar comprando</button>
  </div>
</div>

<script src="js/carrinho.js"></script>
</body>
</html>
